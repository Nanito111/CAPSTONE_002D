# This is a basic workflow to help you get started with Actions

name: Deploy API to Server

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "production" branch
  push:
    branches: [ "production", "backend" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - uses: actions/checkout@v4

        # create dotenv
      - name: Create Dotenv File
        uses: actually-colab/github-action-create-env-file@v2.3
        with:
          envkey_ENVIRONMENT: ${{ vars.ENVIRONMENT }}
          # Project info
          envkey_PROJECT_NAME: ${{ vars.PROJECT_NAME }}
          envkey_PROJECT_VERSION: ${{ vars.PROJECT_VERSION }}
          # API variables
          envkey_API_PROTOCOL: ${{ vars.API_PROTOCOL }}
          envkey_API_HOST_IP: ${{ secrets.API_HOST_IP }}
          envkey_API_BIND_IP: ${{ secrets.API_HOST_IP }}
          envkey_API_PORT: ${{ secrets.API_PORT }}
          envkey_API_WORKERS: ${{ vars.API_WORKERS }}
          envkey_API_SECRET_KEY: ${{ secrets.API_SECRET_KEY}}
          envkey_API_ALGORITHM: ${{ secrets.API_ALGORITHM}}
          # Database variables
          envkey_DB_HOST: ${{ secrets.DB_HOST }}
          envkey_DB_PORT: ${{ secrets.DB_PORT }}
          envkey_DB_DSN_ALIAS: ${{ secrets.DB_DSN_ALIAS }}
          envkey_DB_TNS_FILE_NAME: ${{ secrets.DB_TNS_FILE_NAME }}
          envkey_DB_USER: ${{ secrets.DB_USER }}
          envkey_DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          envkey_DB_WALLET_DIR_NAME: ${{ secrets.DB_WALLET_DIR_NAME }}
          envkey_DB_PEM_FILE_NAME: ${{ secrets.DB_PEM_FILE_NAME }}
          envkey_DB_WALLET_PASSWORD: ${{ secrets.DB_WALLET_PASSWORD }}
          # other variables
          envkey_LOGS_DIR_NAME: ${{ vars.LOGS_DIR_NAME }}
          #tmux variables
          envkey_API_SCREEN_NAME: ${{ secrets.API_SCREEN_NAME }}

        # send dotenv to server
      - name: SFTP Upload
        uses: Dylan700/sftp-upload-action@v1.2.3
        with:
          server: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          passphrase: ${{ secrets.SERVER_KEY_PASS }}
          uploads: |
            ./ => ./${{ secrets.DEPLOY_DIRECTORY }}
          ignore: |
            !.env

        # deploy to server
      - name: Deploy with github
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          passphrase: ${{ secrets.SERVER_KEY_PASS }}
          script: |
            cd ${{ secrets.DEPLOY_DIRECTORY }}
            git checkout ${{ github.event.inputs.branch }}
            git fetch --all
            git pull
            bash ./start-api.sh
